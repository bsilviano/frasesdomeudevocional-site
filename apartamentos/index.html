<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de Apartamentos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b2430;background:#f4f7fc}
header{background:#1f3864;color:#fff;padding:.55rem .9rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
header h1{font-size:1.05rem;margin:0;font-weight:700;margin-right:auto}
header label{font-size:.8rem;display:flex;gap:.3rem;align-items:center}
header select,header button{font:inherit;font-size:.85rem;padding:.3rem .45rem;border-radius:6px;border:0}
header button{background:#2f5597;color:#fff;cursor:pointer}
#wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:calc(100% - 52px)}
#lista{overflow-y:auto;padding:.6rem;display:grid;gap:.55rem;align-content:start;background:#f4f7fc}
.c{background:#fff;border:1px solid #cfd9ea;border-left:4px solid #2f5597;border-radius:8px;padding:.6rem .75rem;cursor:pointer}
.c.sel{border-left-color:#1f3864;box-shadow:0 0 0 2px #9db8e6}
.c b.p{font-size:1.15rem;color:#1f3864}
.c h3{margin:.15rem 0;font-size:.95rem}
.c p{margin:.1rem 0;font-size:.82rem;color:#4a5668}
.c .w{color:#a11d2b;font-weight:600}
#map{height:100%;min-height:300px}
.pin{background:#1f3864;color:#fff;border:2px solid #fff;border-radius:14px;font-weight:700;font-size:12px;padding:3px 7px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.pin.sel{background:#b02a37;z-index:999}
.leaflet-popup-content{margin:.7rem .8rem;font-size:.85rem;min-width:200px}
.leaflet-popup-content a{display:inline-block;margin:.25rem .3rem 0 0;padding:.3rem .55rem;border-radius:6px;background:#2f5597;color:#fff;text-decoration:none;font-size:.8rem}
.leaflet-popup-content a.s{background:#e8eefa;color:#1f3864}
.n{font-size:.75rem;color:#4a5668;padding:.3rem .6rem}
@media (max-width:760px){
 #wrap{grid-template-columns:1fr;grid-template-rows:62% 38%;height:calc(100% - 92px)}
 #map{order:-1}
}
</style>
</head>
<body>
<header>
 <h1>Mapa de Apartamentos <small id="qtd" style="font-weight:400;opacity:.8"></small></h1>
 <label>Cidade <select id="fc"><option value="">Todas</option></select></label>
 <label>Preço <select id="fp"><option value="">Até R$ 250 mil</option><option value="150000">até R$ 150 mil</option><option value="200000">até R$ 200 mil</option><option value="230000">até R$ 230 mil</option></select></label>
 <button id="ver">Ver Tudo</button>
 <button id="sl">Mostrar sem link direto</button>
</header>
<div id="wrap">
 <div id="lista"></div>
 <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
var D={apartamentos:[],zonas_risco:[],favelas:[]},map,layer,zl,fl,markers={},sel='',vis=[];
function brl(v){return v==null?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dist(a,b,c,d){var r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 6371000*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function emZona(a){return D.zonas_risco.some(function(z){return dist(a.lat,a.lon,z.lat,z.lon)<=z.raio})}
var SEMLINK=false;
function nrm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function localOff(a){var L=D.locais_reprovados||[],c=nrm(a.cidade),b=nrm(a.bairro),r=nrm(a.rua);for(var i=0;i<L.length;i++){var l=L[i];if(nrm(l.cidade)!==c)continue;if(l.tipo==='cidade')return true;if(nrm(l.bairro)!==b)continue;if(l.tipo==='bairro')return true;if(l.tipo==='rua'&&r&&nrm(l.rua)===r)return true}return false}
function ok(a){return !localOff(a)&&a.status==='ativo'&&!a.risco_auto&&!emZona(a)&&a.preco!=null&&a.preco<=250000&&(SEMLINK||lk(a).w===null||/apto\.vc/.test(String(a.url||'')))}
function lk(a){var u=String(a.url||'');if(/apto\.vc/.test(u))return{b:'Ver empreendimento',w:'Link do empreendimento: abre a página do lançamento com várias unidades, não um anúncio único.'};if(/\/imobiliaria\/|\/busca\/|\/venda\/apartamentos\/|trovit|nestoria|apartamentos-venda-[a-z-]+\.html|\?page=/.test(u))return{b:'Ver lista do anúncio',w:'Link genérico: abre uma lista (imobiliária ou busca). Procure pela rua e pelo preço.'};return{b:'Ver anúncio',w:null}}
function pop(a){
 var sv='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+a.lat+','+a.lon;
 var gm='https://www.google.com/maps/search/?api=1&query='+a.lat+','+a.lon;
 return '<b>'+brl(a.preco)+'</b><br>'+esc(a.titulo)+'<br>'+(a.dist_recreio_km!=null?(a.dist_recreio_km<1?'No Recreio':a.dist_recreio_km.toFixed(1).replace('.',',')+' km do Recreio')+'<br>':'')+esc([a.rua,a.bairro,a.cidade].filter(Boolean).join(' · '))+(lk(a).w?'<br><i style="color:#b02a37">'+lk(a).w+'</i>':'')+'<br><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+lk(a).b+'</a><a class="s" href="'+gm+'" target="_blank" rel="noopener">Google Maps</a><a class="s" href="'+sv+'" target="_blank" rel="noopener">Street View</a>';
}
function pick(id,fly){
 sel=id;
 [].forEach.call(document.querySelectorAll('.c'),function(e){e.classList.toggle('sel',e.dataset.id===id)});
 for(var k in markers){var el=markers[k].getElement();if(el){var p=el.firstChild;if(p)p.classList.toggle('sel',k===id)}}
 var m=markers[id];if(m){if(fly)map.setView(m.getLatLng(),Math.max(map.getZoom(),15),{animate:true});m.openPopup()}
 var c=document.querySelector('.c[data-id="'+id+'"]');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function draw(fit){
 var fc=document.getElementById('fc').value,fp=Number(document.getElementById('fp').value)||0;
 vis=D.apartamentos.filter(function(a){return ok(a)&&a.lat!=null&&(!fc||a.cidade===fc)&&(!fp||(a.preco!=null&&a.preco<=fp))}).sort(function(x,y){return ((x.dist_recreio_km==null?999:x.dist_recreio_km)-(y.dist_recreio_km==null?999:y.dist_recreio_km))||((x.preco||9e9)-(y.preco||9e9))});
 layer.clearLayers();markers={};
 vis.forEach(function(a){
  var ic=L.divIcon({className:'',html:'<div class="pin">'+Math.round(a.preco/1000)+' mil</div>',iconSize:[0,0]});
  var m=L.marker([a.lat,a.lon],{icon:ic}).addTo(layer);m.bindPopup(pop(a));m.on('click',function(){pick(a.id,false)});markers[a.id]=m;
 });
 zl.clearLayers();D.zonas_risco.forEach(function(z){L.circle([z.lat,z.lon],{radius:z.raio,color:'#b02a37',weight:2,fillColor:'#b02a37',fillOpacity:.2}).bindTooltip('Zona de risco · '+z.raio+' m').addTo(zl)});
 document.getElementById('qtd').textContent='· '+vis.length+' imóveis';
 var l=document.getElementById('lista');l.innerHTML='';
 if(!vis.length)l.innerHTML='<p class="n">Nenhum imóvel com esses filtros.</p>';
 vis.forEach(function(a,i){
  var d=document.createElement('div');d.className='c';d.dataset.id=a.id;
  d.innerHTML='<b class="p">'+brl(a.preco)+'</b><h3>'+esc(a.titulo)+'</h3><p>'+esc([a.rua,a.bairro,a.cidade].filter(Boolean).join(' · '))+'</p><p>'+(a.dist_recreio_km!=null?(a.dist_recreio_km<1?'No Recreio':a.dist_recreio_km.toFixed(1).replace('.',',')+' km do Recreio'):'')+'</p><p>'+esc([a.area?a.area+' m²':null,a.quartos?a.quartos+' quartos':null,a.vagas?a.vagas+' vaga(s)':null,a.condominio?'Cond. '+brl(a.condominio):null,a.estagio].filter(Boolean).join(' · '))+'</p>'+(a.dist_favela_m!=null?'<p>Favela mais próxima: '+a.dist_favela_m+' m</p>':'')+(lk(a).w?'<p class="w">Atenção: '+lk(a).w+'</p>':'')+(a.alerta?'<p class="w">Atenção: '+esc(a.alerta)+'</p>':'')+(a.obs?'<p>'+esc(a.obs)+'</p>':'')+'<p>Fonte: '+esc(a.fonte)+'</p>';
  d.addEventListener('click',function(){pick(a.id,true)});l.appendChild(d);
 });
 if(fit&&vis.length){map.fitBounds(vis.map(function(a){return[a.lat,a.lon]}),{padding:[40,40],maxZoom:13})}
 if(sel&&markers[sel])pick(sel,false);
}
function init(){
 map=L.map('map',{zoomControl:true}).setView([-22.92,-43.3],11);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 layer=L.layerGroup().addTo(map);zl=L.layerGroup().addTo(map);fl=L.layerGroup().addTo(map);
 fetch('dados.json?'+Date.now()).then(function(r){return r.json()}).then(function(j){
  D=j;D.zonas_risco=D.zonas_risco||[];D.locais_reprovados=D.locais_reprovados||[];D.favelas=D.favelas||[];
  var cs={};D.apartamentos.forEach(function(a){if(a.cidade)cs[a.cidade]=1});
  var s=document.getElementById('fc');Object.keys(cs).sort().forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});
  D.favelas.forEach(function(f){L.circle([f.lat,f.lon],{radius:f.raio_m||150,color:'#8a5a00',weight:1,fillColor:'#e0a100',fillOpacity:.25}).bindTooltip('Favela/comunidade: '+(f.nome||'')).addTo(fl)});
  draw(true);
 }).catch(function(){document.getElementById('lista').innerHTML='<p class="n">Não consegui carregar os dados.</p>'});
 document.getElementById('fc').onchange=function(){draw(true)};document.getElementById('fp').onchange=function(){draw(true)};
 document.getElementById('ver').onclick=function(){draw(true)};
 document.getElementById('sl').onclick=function(){SEMLINK=!SEMLINK;this.textContent=SEMLINK?'Esconder sem link direto':'Mostrar sem link direto';draw(true)};
}
init();
})();
</script>
</body>
</html>
